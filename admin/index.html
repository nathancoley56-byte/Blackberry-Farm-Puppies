<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Content Manager</title>
  <!-- Netlify Identity Widget for secure login -->
  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
  <script>
    const configLink = document.createElement("link");
    configLink.rel = "cms-config-url";
    configLink.type = "text/yaml";
    configLink.href = ["localhost", "127.0.0.1"].includes(window.location.hostname)
      ? "/admin/config.local.yml?v=8"
      : "/admin/config.yml?v=8";
    document.head.appendChild(configLink);
  </script>
</head>
<body>
  <!-- Include the script that builds the CMS page -->
  <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
  <script src="/admin/aligned-heading.js?v=2"></script>
  <script src="/admin/photo-wheel-add-button.js?v=3" defer></script>
</body>
</html>
